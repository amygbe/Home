{{ define "main" -}}
<section class="posts">
  <h1>{{ .Title }}</h1>
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}" class="project-card card-link">
    <div class="project-content">
      <h3 class="post-title">{{ .Title }}</h3>
      <p>{{ .Summary }}</p>
      {{ if eq .Kind "page" }}
      <time class="nowrap post-date" datetime="{{ .Date.Format "2006-01-02T15:04:05Z0700" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      {{ end }}
    </div>
    {{ with .Params.image }}
    <div class="project-image">
      <img src="{{ . }}" alt="{{ $.Title }}">
    </div>
    {{ end }}
  </a>
  {{- end }}
</section>
{{- end }}
