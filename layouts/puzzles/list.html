{{ define "main" }}
<div class="post puzzle-page">
  <h1 class="title">{{ .Title }}</h1>
  {{ .Content }}

  <div class="puzzle-list">
    {{ range .Pages.ByDate.Reverse }}
    <a href="{{ .RelPermalink }}" class="puzzle-list-item">
      <span class="puzzle-list-title">{{ .Title }}</span>
      <span class="puzzle-list-meta">
        {{ with .Params.puzzle.difficulty }}
        {{ partial "difficulty-stars.html" . }}
        {{ end }}
        {{ with .Params.puzzle.enumeration }}
        <span class="puzzle-list-enum">{{ . }}</span>
        {{ end }}
      </span>
    </a>
    {{ end }}
  </div>

  <div id="global-leaderboard" class="global-leaderboard">
    <h3 class="global-leaderboard-title">Puzzle Leaderboard</h3>
    <div id="global-leaderboard-table"></div>
  </div>
  <script src="{{ "js/puzzle-leaderboard.js" | relURL }}"></script>
</div>
{{ end }}
